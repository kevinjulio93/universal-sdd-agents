# ==============================================================================
# SonarQube Project Configuration Template (SDD Quality Gate Standard)
# ==============================================================================

sonar.projectKey=engineering-team-project
sonar.projectName=Engineering Team SDD Project
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src,app,lib
sonar.tests=tests,test,__tests__,spec
sonar.sourceEncoding=UTF-8

# Test Coverage Ingestion paths (LCOV, Cobertura, JaCoCo, Python coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/coverage.lcov
sonar.typescript.lcov.reportPaths=coverage/lcov.info,coverage/coverage.lcov
sonar.python.coverage.reportPaths=coverage.xml,coverage/coverage.xml
sonar.coverageReportPaths=coverage/sonar-generic-coverage.xml

# Exclusions
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/test/**,**/tests/**,**/node_modules/**,**/dist/**,**/build/**,**/vendor/**
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*,**/test/**,**/tests/**

# Quality Gate Enforcement
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
